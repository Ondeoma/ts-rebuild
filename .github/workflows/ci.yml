name: CI

on: [push, pull_request]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Build for Test
        run: npm run build

      - name: Run prepare for Test
        run: npm run prepare:example

      - name: Run Tests
        run: npm run test

      - name: Run ESLint
        run: npm run eslint

      - name: Check Formatting (Prettier)
        run: npm run prettier
